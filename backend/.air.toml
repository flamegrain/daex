# air hot-reload config (runs on the VM via daex-dev-api.service)
root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["mkdir -p internal/webui/dist && touch internal/webui/dist/.keep"]
  cmd = "go build -o ./tmp/daex ."
  entrypoint = ["./tmp/daex", "-listen", "0.0.0.0:8080", "-dae-config", "../config.mock.dae"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "internal/webui/dist"]
  delay = 500
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = false
