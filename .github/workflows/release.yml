name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build and Package Binaries
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          fi
          mkdir -p release
          
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../release/dae-webui-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../release/dae-webui-linux-arm64 .
          cd ../release
          
          for arch in amd64 arm64; do
            bin_name="dae-webui-linux-${arch}"
            tar_name="dae-webui-linux-${arch}.tar.gz"
            cp "${bin_name}" dae-webui
            tar -czf "${tar_name}" dae-webui
            rm -f dae-webui
            sha256sum "${tar_name}" >> sha256sums.txt
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: daeX ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/dae-webui-linux-amd64.tar.gz
            release/dae-webui-linux-arm64.tar.gz
            release/dae-webui-linux-amd64
            release/dae-webui-linux-arm64
            release/sha256sums.txt
